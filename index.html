<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f3ef">
  <script>
    /* Apply the saved (or system) theme before first paint to avoid a flash. */
    (function () {
      try {
        var t = localStorage.getItem("retroscaffale.theme");
        if (!t) t = (window.matchMedia
          && matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
        document.documentElement.dataset.theme = t;
        if (t === "dark") {
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute("content", "#16181d");
        }
      } catch (e) { /* no storage — default light */ }
    })();
  </script>
  <meta name="description" content="Traccia la tua collezione di videogiochi tra console e retroconsole — veloce, visiva, offline.">
  <title>RetroScaffale · La tua collezione</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="RetroScaffale">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip-link" href="#view">Salta al contenuto</a>

  <header class="topbar">
    <div class="topbar-inner">
      <button id="backBtn" class="icon-btn back-btn" hidden aria-label="Torna allo scaffale">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="brand" id="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-text">Retro<b>Scaffale</b></span>
      </div>
      <div class="topbar-right">
        <button id="themeBtn" class="icon-btn" type="button" aria-pressed="false"></button>
        <div class="topbar-actions" id="topActions"></div>
      </div>
    </div>
    <div class="context-bar" id="contextBar" hidden></div>
  </header>

  <main id="view" tabindex="-1"></main>

  <button id="installBtn" class="install-btn" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14"/></svg>
    <span>Installa l'app</span>
  </button>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
